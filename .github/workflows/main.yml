name: Deploy do Lovable para o GitHub Pages

on:
  push:
    branches: ["main"] # IMPORTANTE: Se no Passo 1 você viu "master", troque "main" por "master" aqui.

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node.js (Ambiente)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar as dependências
        run: npm install

      - name: Construir (Converter) o site
        run: npm run build

      - name: Preparar os arquivos convertidos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # O Lovable salva a versão convertida na pasta "dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
